name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Python tests and offline demo
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: test
      AI_PROVIDER: disabled
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            constraints/python314-linux.txt
      - name: Install the constrained test environment
        run: python -m pip install -r requirements-ci.txt -c constraints/python314-linux.txt
      - name: Verify dependencies
        run: python -m pip check
      - name: Run all regressions, including local libSQL adapter tests
        run: python -m pytest -q
      - name: Verify the isolated offline showcase
        run: python scripts/serve_demo.py --check
      - name: Inspect the tracked publication surface
        run: python scripts/check_public_snapshot.py

  secrets:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan complete Git history
        uses: docker://ghcr.io/gitleaks/gitleaks:v8.30.1
        with:
          args: git --config .gitleaks.toml --redact --no-banner

  container:
    name: Container demo smoke
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Build the complete application image
        run: docker build -t opportunity-showcase .
      - name: Run the fictional offline demo smoke check
        run: docker run --rm --network none opportunity-showcase python scripts/serve_demo.py --container --check
