[project]
name = "opportunity-engine-showcase"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "jinja2",
  "httpx",
  "python-multipart",
  "pypdf",
  "python-docx",
  "Pillow>=12.2.0",
  "reportlab>=4.4,<5",
]


[project.optional-dependencies]
cloud = ["libsql==0.1.11", "vercel==0.10.0"]

[[tool.vercel.subscribers]]
entrypoint = "background_subscriber:consume_work"
topics = ["oe-work-v1"]
